# The checks every change has to pass: the same as `npm run validate`, split in two jobs that run in
# parallel (the boundaries of the architecture, and everything else) and in steps, so that the one
# that fails is the first thing the run page shows. It is also called by the workflow that builds the
# app (a tag is built only if both jobs pass), and it is the gate of EAS Update.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# A new push to a branch cancels the run of the previous one. The group has the ref in it, so a pull
# request, main and a tag never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reads the code and nothing else. No secret is used here, so a pull request from a fork runs the
# same checks.
permissions:
  contents: read

env:
  # Hooks are for the machines of the developers.
  HUSKY: '0'
  EXPO_NO_TELEMETRY: '1'

jobs:
  # Pinned to ubuntu-24.04: GitHub began moving ubuntu-latest to Ubuntu 26 on 19 October 2026.

  # The boundaries between the layers, and the packages each layer may import, are rules of ESLint.
  # This job runs them alone on the code of the app, beside the job below, so that a broken boundary
  # fails a check of its own that is named after it. The full lint below runs the same rules again.
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Check the boundaries (ESLint on app/ and src/)
        run: npm run lint:architecture

  validate:
    name: Lint, types, format, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # The tests of the four Jest projects, with the coverage of all of src/ and its two gates:
      # 90 percent for each domain and application folder (of the core and of every feature), 70
      # percent for the rest. Jest fails the step when one is not met.
      - name: Tests with the coverage gate
        run: npm run test:coverage -- --ci

      # The coverage as a table on the page of the run (infrastructure, presentation and the
      # composition included), read from the json-summary report of the step above. It is written
      # even when the tests fail, which is when the figures are wanted.
      - name: Show the coverage in the run summary
        if: ${{ !cancelled() }}
        run: node tooling/printCoverageTable.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
