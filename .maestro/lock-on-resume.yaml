# Send the app to the background for longer than the grace period (30 seconds, APP_LOCK_GRACE_PERIOD
# in src/composition/container/config.ts), bring it back, and see the lock screen instead of the
# meetings; unlock, and see the meetings again. The mock configuration unlocks without a biometric prompt.
#
# `stopApp: false` is essential: the mock session lives in the memory of the process, and killing the
# app would end it and start again on the sign-in screen, which is not what this flow checks.
appId: com.boardroom.demo
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- assertVisible:
    id: meetings-list
- pressKey: Home
# Maestro has no "sleep": wait for something that never shows up, and let the wait run out.
- extendedWaitUntil:
    visible:
      id: never-shown-wait-for-the-grace-period
      optional: true
    timeout: 35000
- launchApp:
    appId: com.boardroom.demo
    stopApp: false
    clearState: false
- extendedWaitUntil:
    visible:
      id: lock-screen
    timeout: 30000
# Nothing of the signed-in user is on the screen behind the lock.
- assertNotVisible:
    id: meetings-list
- tapOn:
    id: lock-unlock
- extendedWaitUntil:
    visible:
      id: meetings-list
    timeout: 30000
- assertNotVisible:
    id: lock-screen
